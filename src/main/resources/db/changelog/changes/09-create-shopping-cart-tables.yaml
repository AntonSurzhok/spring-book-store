databaseChangeLog:
    - changeSet:
        id: create-shopping-carts-table
        author: anton
        changes:
          - createTable:
              tableName: shopping_carts
              columns:
                - column:
                    name: id
                    type: BIGINT
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: user_id
                    type: BIGINT
                    constraints:
                      nullable: false
                      unique: true

          - addForeignKeyConstraint:
              baseTableName: shopping_carts
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: id
              constraintName: fk-shopping-carts-user
              onDelete: CASCADE

    - changeSet:
        id: create-cart-items-table
        author: anton
        changes:
          - createTable:
              tableName: cart_items
              columns:
                - column:
                    name: id
                    type: BIGINT
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: shopping_cart_id
                    type: BIGINT
                    constraints:
                      nullable: false

                - column:
                    name: book_id
                    type: BIGINT
                    constraints:
                      nullable: false

                - column:
                    name: quantity
                    type: INT
                    constraints:
                      nullable: false

          - addForeignKeyConstraint:
              baseTableName: cart_items
              baseColumnNames: shopping_cart_id
              referencedTableName: shopping_carts
              referencedColumnNames: id
              constraintName: fk-cart-items-shopping-cart
              onDelete: CASCADE

          - addForeignKeyConstraint:
              baseTableName: cart_items
              baseColumnNames: book_id
              referencedTableName: books
              referencedColumnNames: id
              constraintName: fk-cart-items-book
              onDelete: CASCADE

          - addUniqueConstraint:
              tableName: cart_items
              columnNames: shopping_cart_id, book_id
              constraintName: uk-cart-items-shopping-cart-book